<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grosser Rat</title>
  <link rel="stylesheet" href="https://edwardtufte.github.io/tufte-css/tufte.css" />
  <link rel="stylesheet" href="custom.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .title-block {
      margin-bottom: 0.75rem;
    }

    .intro-text {
      margin: 0 0 1rem 0;
      max-width: 1000px;
      font-size: 1.5rem;
      line-height: 1.6;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(180px, 0.7fr);
      gap: 1rem;
      align-items: start;
      justify-content: center;
    }

    .chart-col {
      min-width: 0;
      position: sticky;
      top: 0;
      align-self: start;
    }

    .chart-note {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #333;
    }

    .chart-note p {
      margin: 0 0 0.5rem 0;
    }

    .chart-note p:last-child {
      margin-bottom: 0;
    }

    .text-col {
      margin-top: 10px;
      background: #f8f8f8;
      border-left: 3px solid #d8d8d8;
      padding: 1rem 1.1rem;
      font-size: 0.75rem;
      line-height: 1.5;
      max-width: 100%;
      justify-self: stretch;
    }

    .text-col p {
      margin-top: 0;
      margin-bottom: 0.7rem;
    }

    .text-col p:last-child {
      margin-bottom: 0;
    }

    .stat-list {
      margin: 0.7rem 0 0;
      padding-left: 1.1rem;
    }

    .stat-list li {
      margin-bottom: 0.25rem;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto;
      background: transparent;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .text-col {
        margin-top: 0;
        border-left: none;
        border-top: 3px solid #d8d8d8;
        max-width: 100%;
      }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: end;
    }

    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #222;
    }

    .controls select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      font: inherit;
      font-size: 1.08rem;
      line-height: 1.2;
      padding: 0.8rem 2.5rem 0.8rem 0.9rem;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fa 100%);
      color: #1f2328;
      min-width: 170px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      background-image: linear-gradient(45deg, transparent 50%, #4b5563 50%), linear-gradient(135deg, #4b5563 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .controls select:hover {
      border-color: #9aa7b2;
      box-shadow: 0 2px 8px rgba(16, 24, 40, 0.08);
    }

    .controls select:focus {
      outline: none;
      border-color: #2f80ed;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      margin: 0 0 1rem 0;
      padding: 0.8rem 0.9rem;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fafafa;
      max-width: 980px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: #2f2f2f;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.15);
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="title-block">
      <h2>Grosser Rat</h2>
      <p class="intro-text">Die Zusammensetzung des Grossrats visualisiert. In der ersten Ansicht sind alle Mitglieder in einem Block aufgereiht. Sie können die Sitzverteilung nach verschiedenen Merkmalen darstellen und einfärben.</p>
    </div>

    <section class="distribution-section">

      <div class="controls">
        <label>
          Sitzverteilung
          <select id="arrangement-select">
            <option value="default">Alle</option>
            <option value="Bezirk">Bezirk</option>
            <option value="Geschlecht">Geschlecht</option>
            <option value="Zugehörigkeit">Zugehörigkeit</option>
            <option value="Amtsjahre">Amtsjahre</option>
          </select>
        </label>

        <label>
          Merkmal
          <select id="color-select">
            <option value="Bezirk">Bezirk</option>
            <option value="Geschlecht">Geschlecht</option>
            <option value="Zugehörigkeit">Zugehörigkeit</option>
            <option value="Amtsjahre">Amtsjahre</option>
          </select>
        </label>
      </div>

      <div id="legend" class="legend" aria-live="polite"></div>

      <svg id="distribution-svg"></svg>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    async function loadHTML(id, url) {
      const resp = await fetch(url);
      const text = await resp.text();
      document.getElementById(id).innerHTML = text;
    }
    loadHTML('header-placeholder', 'components/header.html');
    loadHTML('footer-placeholder', 'components/footer.html');
  </script>

  <script>
    const tooltip = d3.select("body").append("div")
      .style("position", "absolute")
      .style("background", "#fff")
      .style("padding", "6px 10px")
      .style("border", "1px solid #ccc")
      .style("border-radius", "6px")
      .style("pointer-events", "none")
      .style("display", "none");

    const state = {
      arrangement: "default",
      colorMode: "Bezirk"
    };

    d3.dsv(";", "data/grosser-rat.csv").then(data => {
      const rows = data
        .map(d => {
          const bezirkValue = (d["Bezirk "] || d.Bezirk || "").trim();
          return {
            Jahr: Number(d.Wahljahr),
            Funktion: (d.Funktion || "").trim(),
            Geschlecht: (d.Geschlecht || "").trim().toLowerCase(),
            Name: (d["Name und Vorname"] || "").trim(),
            Bezirk: bezirkValue,
            Zugehörigkeit: (d.Zugehörigkeit || "").trim(),
            Amtsdauer: Number(d.Amtsdauer || 0)
          };
        })
        .filter(d => !Number.isNaN(d.Jahr) && d.Jahr > 0 && d.Name !== "" && d.Bezirk !== "");

      const districtOrder = ["Appenzell", "Schwende-Rüte", "Schlatt-Haslen", "Gonten", "Oberegg"];
      const districtColorScale = d3.scaleOrdinal()
        .domain(districtOrder)
        .range([
          d3.interpolateViridis(0.12),
          d3.interpolateViridis(0.38),
          d3.interpolateViridis(0.58),
          d3.interpolateViridis(0.75),
          d3.interpolateViridis(0.9)
        ]);

      const zugehoerigkeitColorScale = d3.scaleOrdinal()
        .domain(["Arbeitnehmende", "Bäuerinnen und Bauern", "Gewerbe"])
        .range([
          d3.interpolateViridis(0.10),
          d3.interpolateViridis(0.55),
          d3.interpolateViridis(0.99)
        ]);

      const arrangementSelect = document.getElementById("arrangement-select");
      const colorSelect = document.getElementById("color-select");

      function syncColorFromArrangement() {
        if (state.arrangement !== "default") {
          state.colorMode = state.arrangement;
          colorSelect.value = state.colorMode;
        } else {
          colorSelect.value = state.colorMode;
        }
      }

      function normalizeZugehoerigkeit(value) {
        const text = String(value || "").trim();
        if (!text) return "";

        const normalized = text.replace(/\s+/g, " ");
        const lower = normalized.toLowerCase();

        if (lower.includes("arbeitnehmendenvereinigung")) return "Arbeitnehmende";
        if (lower.includes("bäuerinnen") || lower.includes("bauernverband") || lower.includes("landfrauenverband")) return "Bäuerinnen und Bauern";
        if (lower.includes("gewerbe")) return "Gewerbe";

        const replacements = {
          "Arbeitnehmendenvereinigung Appenzell (AVA)": "Arbeitnehmende",
          "Bäuerinnen- und Landfrauenverband Appenzell Innerrhoden (BLV AI) od. Bauernverband AI": "Bäuerinnen und Bauern",
          "Kantonaler Gewerbeverband Appenzell Innerrhoden": "Gewerbe",
          "Kantonaler Gewerbeverand Appenzell Innerrhoden (KGVAI)": "Gewerbe"
        };

        return replacements[normalized] || normalized;
      }

      function labelFor(value, mode) {
        if (mode === "Geschlecht") return value === "f" ? "Frau" : "Mann";
        if (mode === "Amtsjahre") return `${value} Jahre`;
        if (mode === "Zugehörigkeit") return normalizeZugehoerigkeit(value);
        return String(value);
      }

      function valueForGrouping(member, mode) {
        if (mode === "Bezirk") return member.Bezirk;
        if (mode === "Geschlecht") return member.Geschlecht;
        if (mode === "Zugehörigkeit") return normalizeZugehoerigkeit(member.Zugehörigkeit);
        if (mode === "Amtsjahre") return member.Amtsdauer;
        return "default";
      }

      function colorFor(member, mode, valueList) {
        if (mode === "default") return "#111";

        if (mode === "Bezirk") {
          return districtColorScale(member.Bezirk);
        }

        if (mode === "Geschlecht") {
          return member.Geschlecht === "f" ? "#f1d34c" : "#2f9ea4";
        }

        if (mode === "Zugehörigkeit") {
          return zugehoerigkeitColorScale(valueForGrouping(member, mode));
        }

        const scale = d3.scaleSequential(d3.interpolateViridis)
          .domain([0, Math.max(1, valueList.length - 1)]);

        const index = valueList.indexOf(valueForGrouping(member, mode));
        return scale(index >= 0 ? index : 0);
      }

      function groupAndSort(list, mode) {
        if (mode === "default") {
          return [{ key: "Alle", members: list.slice().sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name)) }];
        }

        const groups = d3.group(list, d => valueForGrouping(d, mode));
        const entries = [...groups.entries()].sort((a, b) => {
          const av = a[0];
          const bv = b[0];
          if (typeof av === "number" && typeof bv === "number") return av - bv;
          return String(av).localeCompare(String(bv));
        });

        return entries.map(([key, members]) => ({
          key,
          members: members.slice().sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name))
        }));
      }

      function hoverTooltip(event, member) {
        tooltip
          .style("display", "block")
          .html(`
            <strong>${member.Name}</strong><br>
            ${member.Funktion} Bezirk ${member.Bezirk}<br>
            Wahljahr: ${member.Jahr}<br>
            Zugehörigkeit: ${normalizeZugehoerigkeit(member.Zugehörigkeit)}
          `);
        tooltip
          .style("left", `${event.pageX + 12}px`)
          .style("top", `${event.pageY - 12}px`);
      }

      function wrapLabel(text, maxChars = 22) {
        if (!text) return "";
        const words = String(text).split(/\s+/);
        const lines = [];
        let current = "";

        words.forEach(word => {
          const candidate = current ? `${current} ${word}` : word;
          if (candidate.length <= maxChars) {
            current = candidate;
          } else {
            if (current) lines.push(current);
            current = word;
          }
        });

        if (current) lines.push(current);
        return lines.slice(0, 3).join("\n");
      }

      function drawGroupLabel(svg, cx, y, labelText) {
        const lines = wrapLabel(labelText, 22).split("\n");
        svg.append("text")
          .attr("x", cx)
          .attr("y", y)
          .attr("text-anchor", "middle")
          .attr("font-size", 11)
          .attr("fill", "#333")
          .selectAll("tspan")
          .data(lines)
          .join("tspan")
          .attr("x", cx)
          .attr("dy", (d, i) => i === 0 ? 0 : 12)
          .text(d => d);
      }

      function renderDefault() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const members = rows.slice().sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name));
        const cols = 10;
        const startX = 20;
        const startY = 20;
        const colGap = 30;
        const rowGap = 28;
        const width = 900;
        const height = 200;

        members.forEach((member, index) => {
          const row = Math.floor(index / cols);
          const col = index % cols;
          const x = startX + col * colGap;
          const y = startY + row * rowGap;

          svg.append("circle")
            .attr("cx", x)
            .attr("cy", y)
            .attr("r", 9)
            .attr("fill", colorFor(member, state.colorMode, []))
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.3)
            .style("transition", "all 0.4s ease")
            .on("mouseover", event => hoverTooltip(event, member))
            .on("mousemove", event => hoverTooltip(event, member))
            .on("mouseout", () => tooltip.style("display", "none"));
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderDistrictLayout() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const groups = districtOrder.map(name => ({
          key: name,
          members: rows.filter(d => d.Bezirk === name).sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name))
        }));

        const columns = 5;
        const groupWidth = 180;
        const startX = 20;
        const startY = 20;
        const rowGap = 26;
        const colGap = 28;
        const membersPerRow = 5;
        const maxRows = Math.max(...groups.map(group => Math.max(1, Math.ceil(group.members.length / membersPerRow))));
        const labelBaseY = startY + maxRows * rowGap + 28;

        const width = Math.max(1000, startX + columns * groupWidth + 60);
        const height = labelBaseY + 40;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + (groupIndex % columns) * groupWidth;
          const groupY = startY + Math.floor(groupIndex / columns) * 120;

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % membersPerRow;
            const row = Math.floor(memberIndex / membersPerRow);
            const x = groupX + 20 + col * colGap;
            const y = groupY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, [group.key]))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + 50, labelBaseY, group.key);
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderCategoryLayout() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const groups = groupAndSort(rows, state.arrangement);
        const maxMembers = Math.max(...groups.map(g => g.members.length), 1);
        const maxRows = Math.max(1, Math.ceil(maxMembers / 6));
        const groupWidth = 230;
        const startX = 30;
        const startY = 30;
        const rowGap = 26;
        const colGap = 28;
        const labelBaseY = startY + maxRows * rowGap + 30;
        const width = Math.max(900, startX + groups.length * groupWidth + 80);
        const height = labelBaseY + 40;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + groupIndex * groupWidth;

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % 6;
            const row = Math.floor(memberIndex / 6);
            const x = groupX + 20 + col * colGap;
            const y = startY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, groups.map(g => g.key)))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + groupWidth / 2, labelBaseY, labelFor(group.key, state.arrangement));
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderAmtsjahreTimeline() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const groups = groupAndSort(rows, "Amtsjahre");
        const maxMembers = Math.max(...groups.map(g => g.members.length), 1);
        const membersPerRow = 2;
        const rowGap = 24;
        const colGap = 18;
        const groupGap = 5;
        const groupWidth = 50;
        const startX = 25;
        const startY = 30;
        const maxRowsInGroup = Math.max(1, Math.ceil(Math.max(...groups.map(g => g.members.length), 1) / membersPerRow));
        const labelBaseY = startY + maxRowsInGroup * rowGap + 8;
        const width = Math.max(900, startX + groups.length * (groupWidth + groupGap) + 18);
        const height = labelBaseY + 30;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + groupIndex * (groupWidth + groupGap);
          const groupRows = Math.max(1, Math.ceil(group.members.length / membersPerRow));

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % membersPerRow;
            const row = Math.floor(memberIndex / membersPerRow);
            const x = groupX + 20 + col * colGap;
            const y = startY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, groups.map(g => g.key)))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + 35, labelBaseY, `${group.key} Jahre`);
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderDistribution() {
        renderLegend();

        if (state.arrangement === "default") {
          renderDefault();
          return;
        }

        if (state.arrangement === "Bezirk") {
          renderDistrictLayout();
          return;
        }

        if (state.arrangement === "Amtsjahre") {
          renderAmtsjahreTimeline();
          return;
        }

        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const groups = groupAndSort(rows, state.arrangement);
        const maxMembers = Math.max(...groups.map(g => g.members.length), 1);
        const maxRows = Math.max(1, Math.ceil(maxMembers / 6));
        const colsPerGroup = Math.min(8, Math.max(4, Math.ceil(Math.sqrt(maxMembers))));
        const groupWidth = 220;
        const startX = 30;
        const startY = 30;
        const rowGap = 26;
        const colGap = 28;
        const labelBaseY = startY + maxRows * rowGap + 35;
        const width = Math.max(900, startX + groups.length * groupWidth + 80);
        const height = labelBaseY + 40;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + groupIndex * groupWidth;

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % colsPerGroup;
            const row = Math.floor(memberIndex / colsPerGroup);
            const x = groupX + 20 + col * colGap;
            const y = startY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, groups.map(g => g.key)))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + groupWidth / 2, labelBaseY, labelFor(group.key, state.arrangement));
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderLegend() {
        const legendEl = document.getElementById("legend");
        legendEl.innerHTML = "";

        if (state.colorMode === "default") {
          legendEl.style.display = "none";
          return;
        }

        legendEl.style.display = "flex";

        const entries = [];

        if (state.colorMode === "Bezirk") {
          districtOrder.forEach((district) => {
            entries.push({ label: district, color: districtColorScale(district) });
          });
        } else if (state.colorMode === "Geschlecht") {
          entries.push({ label: "Frau", color: "#f1d34c" });
          entries.push({ label: "Mann", color: "#2f9ea4" });
        } else if (state.colorMode === "Zugehörigkeit") {
          const colors = zugehoerigkeitColorScale.range();
          entries.push({ label: "Arbeitnehmende", color: colors[0] });
          entries.push({ label: "Bäuerinnen und Bauern", color: colors[1] });
          entries.push({ label: "Gewerbe", color: colors[2] });
        } else if (state.colorMode === "Amtsjahre") {
          const min = 1;
          const max = Math.max(20, ...rows.map(d => d.Amtsdauer));
          const scale = d3.scaleSequential(d3.interpolateViridis).domain([min, max]);
          const labels = [min, Math.round((min + max) / 2), max];
          labels.forEach((value) => {
            entries.push({ label: `${value} Jahre`, color: scale(value) });
          });
        }

        entries.forEach(({ label, color }) => {
          const item = document.createElement("div");
          item.className = "legend-item";

          const swatch = document.createElement("span");
          swatch.className = "legend-swatch";
          swatch.style.background = color;

          const text = document.createElement("span");
          text.textContent = label;

          item.appendChild(swatch);
          item.appendChild(text);
          legendEl.appendChild(item);
        });
      }

      arrangementSelect.addEventListener("change", (event) => {
        state.arrangement = event.target.value;
        syncColorFromArrangement();
        renderDistribution();
      });

      colorSelect.addEventListener("change", (event) => {
        state.colorMode = event.target.value;
        renderDistribution();
      });

      syncColorFromArrangement();
      renderDistribution();
    });
  </script>
</body>
</html>
