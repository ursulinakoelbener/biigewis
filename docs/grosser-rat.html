<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grosser Rat</title>
  <link rel="stylesheet" href="https://edwardtufte.github.io/tufte-css/tufte.css" />
  <link rel="stylesheet" href="custom.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .title-block {
      margin-bottom: 0.75rem;
    }

    .intro-text {
      margin: 0 0 1rem 0;
      max-width: 1000px;
      font-size: 1.5rem;
      line-height: 1.6;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(180px, 0.7fr);
      gap: 1rem;
      align-items: start;
      justify-content: center;
    }

    .chart-col {
      min-width: 0;
      position: sticky;
      top: 0;
      align-self: start;
    }

    .chart-note {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #333;
    }

    .chart-note p {
      margin: 0 0 0.5rem 0;
    }

    .chart-note p:last-child {
      margin-bottom: 0;
    }

    .text-col {
      margin-top: 10px;
      background: #f8f8f8;
      border-left: 3px solid #d8d8d8;
      padding: 1rem 1.1rem;
      font-size: 0.75rem;
      line-height: 1.5;
      max-width: 100%;
      justify-self: stretch;
    }

    .text-col p {
      margin-top: 0;
      margin-bottom: 0.7rem;
    }

    .text-col p:last-child {
      margin-bottom: 0;
    }

    .stat-list {
      margin: 0.7rem 0 0;
      padding-left: 1.1rem;
    }

    .stat-list li {
      margin-bottom: 0.25rem;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto;
      background: transparent;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .text-col {
        margin-top: 0;
        border-left: none;
        border-top: 3px solid #d8d8d8;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="title-block">
      <h2>Grosser Rat</h2>
      <p class="intro-text">Die Zusammensetzung des Grossrats visualisiert. In der ersten Ansicht sind alle Mitglieder in einem Block aufgereiht. Sie können die Sitzverteilung nach verschiedenen Merkmalen darstellen.</p>
    </div>

    <section class="distribution-section">

      <div class="controls" style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
        <label>
          Sitzverteilung
          <select id="arrangement-select" style="margin-left:0.5rem;">
            <option value="default">Alle</option>
            <option value="Bezirk">Bezirk</option>
            <option value="Geschlecht">Geschlecht</option>
            <option value="Zugehörigkeit">Zugehörigkeit</option>
            <option value="Amtsjahre">Amtsjahre</option>
          </select>
        </label>

        <label>
          Merkmal
          <select id="color-select" style="margin-left:0.5rem;">
            <option value="default">default</option>
            <option value="Bezirk">Bezirk</option>
            <option value="Geschlecht">Geschlecht</option>
            <option value="Zugehörigkeit">Zugehörigkeit</option>
            <option value="Amtsjahre">Amtsjahre</option>
          </select>
        </label>
      </div>

      <svg id="distribution-svg"></svg>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    async function loadHTML(id, url) {
      const resp = await fetch(url);
      const text = await resp.text();
      document.getElementById(id).innerHTML = text;
    }
    loadHTML('header-placeholder', 'components/header.html');
    loadHTML('footer-placeholder', 'components/footer.html');
  </script>

  <script>
    const tooltip = d3.select("body").append("div")
      .style("position", "absolute")
      .style("background", "#fff")
      .style("padding", "6px 10px")
      .style("border", "1px solid #ccc")
      .style("border-radius", "6px")
      .style("pointer-events", "none")
      .style("display", "none");

    const state = {
      arrangement: "default",
      district: "all",
      colorMode: "default"
    };

    d3.dsv(";", "data/grosser-rat.csv").then(data => {
      const rows = data
        .map(d => ({
          Jahr: Number(d.Wahljahr),
          Funktion: (d.Funktion || "").trim(),
          Geschlecht: (d.Geschlecht || "").trim().toLowerCase(),
          Name: (d["Name und Vorname"] || "").trim(),
          Bezirk: (d.Bezirk || "").trim(),
          Zugehörigkeit: (d.Zugehörigkeit || "").trim(),
          Amtsdauer: Number(d.Amtsdauer || 0)
        }))
        .filter(d => !Number.isNaN(d.Jahr) && d.Jahr > 0 && d.Name !== "");

      const districtOrder = [...new Set(rows.map(d => d.Bezirk))].sort();
      const arrangementSelect = document.getElementById("arrangement-select");
      const colorSelect = document.getElementById("color-select");

      function labelFor(value, mode) {
        if (mode === "Geschlecht") return value === "f" ? "Frau" : "Mann";
        if (mode === "Amtsjahre") return `${value} Jahre`;
        return String(value);
      }

      function colorFor(member, mode, valueList) {
        if (mode === "default") return "#111";

        if (mode === "Geschlecht") {
          return member.Geschlecht === "f" ? "#f1d34c" : "#2f9ea4";
        }

        const scale = d3.scaleSequential(d3.interpolateViridis)
          .domain([0, Math.max(1, valueList.length - 1)]);

        const index = valueList.indexOf(valueForGrouping(member, mode));
        return scale(index >= 0 ? index : 0);
      }

      function valueForGrouping(member, mode) {
        if (mode === "Bezirk") return member.Bezirk;
        if (mode === "Geschlecht") return member.Geschlecht;
        if (mode === "Zugehörigkeit") return member.Zugehörigkeit;
        if (mode === "Amtsjahre") return member.Amtsdauer;
        return "default";
      }

      function groupAndSort(list, mode) {
        if (mode === "default") {
          return [{ key: "Alle", members: list.slice().sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name)) }];
        }

        const groups = d3.group(list, d => valueForGrouping(d, mode));
        const entries = [...groups.entries()].sort((a, b) => {
          const av = a[0];
          const bv = b[0];
          if (typeof av === "number" && typeof bv === "number") return av - bv;
          return String(av).localeCompare(String(bv));
        });

        return entries.map(([key, members]) => ({
          key,
          members: members.slice().sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name))
        }));
      }

      function hoverTooltip(event, member) {
        tooltip
          .style("display", "block")
          .html(`
            <strong>${member.Name}</strong><br>
            ${member.Funktion}<br>
            Wahljahr: ${member.Jahr}<br>
            Zugehörigkeit: ${member.Zugehörigkeit}
          `);
        tooltip
          .style("left", `${event.pageX + 12}px`)
          .style("top", `${event.pageY - 12}px`);
      }

      function renderDefault() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const members = rows.slice().sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name));
        const cols = 10;
        const startX = 70;
        const startY = 30;
        const colGap = 30;
        const rowGap = 28;
        const width = 900;
        const height = 200;

        members.forEach((member, index) => {
          const row = Math.floor(index / cols);
          const col = index % cols;
          const x = startX + col * colGap;
          const y = startY + row * rowGap;

          svg.append("circle")
            .attr("cx", x)
            .attr("cy", y)
            .attr("r", 9)
            .attr("fill", colorFor(member, state.colorMode, []))
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.3)
            .style("transition", "all 0.4s ease")
            .on("mouseover", event => hoverTooltip(event, member))
            .on("mousemove", event => hoverTooltip(event, member))
            .on("mouseout", () => tooltip.style("display", "none"));
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function wrapLabel(text, maxChars = 22) {
        if (!text) return "";
        const words = String(text).split(/\s+/);
        const lines = [];
        let current = "";

        words.forEach(word => {
          const candidate = current ? `${current} ${word}` : word;
          if (candidate.length <= maxChars) {
            current = candidate;
          } else {
            if (current) lines.push(current);
            current = word;
          }
        });

        if (current) lines.push(current);
        return lines.slice(0, 3).join("\n");
      }

      function drawGroupLabel(svg, cx, y, labelText, width = 220) {
        const lines = wrapLabel(labelText, 22).split("\n");
        svg.append("text")
          .attr("x", cx)
          .attr("y", y)
          .attr("text-anchor", "middle")
          .attr("font-size", 11)
          .attr("fill", "#333")
          .selectAll("tspan")
          .data(lines)
          .join("tspan")
          .attr("x", cx)
          .attr("dy", (d, i) => i === 0 ? 0 : 12)
          .text(d => d);
      }

      function renderDistrictLayout() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const selectedDistricts = state.district === "all"
          ? districtOrder
          : districtOrder.filter(name => name === state.district);

        const groups = selectedDistricts.map(name => ({
          key: name,
          members: rows
            .filter(d => d.Bezirk === name)
            .sort((a, b) => a.Jahr - b.Jahr || a.Name.localeCompare(b.Name))
        }));

        const columns = 5;
        const groupWidth = 180;
        const startX = 70;
        const startY = 20;
        const rowGap = 26;
        const colGap = 28;
        const maxRows = Math.max(...groups.map(group => Math.max(1, Math.ceil(group.members.length / 6))));
        const labelBaseY = startY + maxRows * rowGap + 28;

        const width = Math.max(1000, startX + columns * groupWidth + 60);
        const height = labelBaseY + 40;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + (groupIndex % columns) * groupWidth;
          const groupY = startY + Math.floor(groupIndex / columns) * 120;
          const membersPerRow = 6;

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % membersPerRow;
            const row = Math.floor(memberIndex / membersPerRow);
            const x = groupX + 20 + col * colGap;
            const y = groupY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, [group.key]))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + 50, labelBaseY, group.key, groupWidth);
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderCategoryLayout() {
        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const filtered = state.district === "all" ? rows : rows.filter(d => d.Bezirk === state.district);
        const groups = groupAndSort(filtered, state.arrangement);
        const maxMembers = Math.max(...groups.map(g => g.members.length), 1);
        const maxRows = Math.max(1, Math.ceil(maxMembers / 6));
        const groupWidth = 230;
        const startX = 90;
        const startY = 30;
        const rowGap = 26;
        const colGap = 28;
        const labelBaseY = startY + maxRows * rowGap + 30;
        const width = Math.max(900, startX + groups.length * groupWidth + 80);
        const height = labelBaseY + 40;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + groupIndex * groupWidth;

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % 6;
            const row = Math.floor(memberIndex / 6);
            const x = groupX + 20 + col * colGap;
            const y = startY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, groups.map(g => g.key)))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + groupWidth / 2, labelBaseY, labelFor(group.key, state.arrangement), groupWidth);
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      function renderDistribution() {
        if (state.arrangement === "default") {
          renderDefault();
          return;
        }

        if (state.arrangement === "Bezirk") {
          renderDistrictLayout();
          return;
        }

        if (state.arrangement === "Zugehörigkeit") {
          renderCategoryLayout();
          return;
        }

        const svg = d3.select("#distribution-svg");
        svg.selectAll("*").remove();

        const filtered = state.district === "all"
          ? rows
          : rows.filter(d => d.Bezirk === state.district);

        const groups = groupAndSort(filtered, state.arrangement);
        const maxMembers = Math.max(...groups.map(g => g.members.length), 1);
        const maxRows = Math.max(1, Math.ceil(maxMembers / 6));
        const colsPerGroup = Math.min(8, Math.max(4, Math.ceil(Math.sqrt(maxMembers))));
        const groupWidth = 220;
        const startX = 90;
        const startY = 30;
        const rowGap = 26;
        const colGap = 28;
        const labelBaseY = startY + maxRows * rowGap + 35;
        const width = Math.max(900, startX + groups.length * groupWidth + 80);
        const height = labelBaseY + 40;

        groups.forEach((group, groupIndex) => {
          const groupX = startX + groupIndex * groupWidth;

          group.members.forEach((member, memberIndex) => {
            const col = memberIndex % colsPerGroup;
            const row = Math.floor(memberIndex / colsPerGroup);
            const x = groupX + 20 + col * colGap;
            const y = startY + row * rowGap;

            svg.append("circle")
              .attr("cx", x)
              .attr("cy", y)
              .attr("r", 9)
              .attr("fill", colorFor(member, state.colorMode, groups.map(g => g.key)))
              .attr("stroke", "#fff")
              .attr("stroke-width", 1.3)
              .style("transition", "all 0.4s ease")
              .on("mouseover", event => hoverTooltip(event, member))
              .on("mousemove", event => hoverTooltip(event, member))
              .on("mouseout", () => tooltip.style("display", "none"));
          });

          drawGroupLabel(svg, groupX + groupWidth / 2, labelBaseY, labelFor(group.key, state.arrangement), groupWidth);
        });

        svg.attr("viewBox", `0 0 ${width} ${height}`)
           .attr("preserveAspectRatio", "xMinYMin meet");
      }

      districtSelect.addEventListener("change", (event) => {
        state.district = event.target.value;
        renderDistribution();
      });

      arrangementSelect.addEventListener("change", (event) => {
        state.arrangement = event.target.value;
        renderDistribution();
      });

      colorSelect.addEventListener("change", (event) => {
        state.colorMode = event.target.value;
        renderDistribution();
      });

      renderDistribution();
    });
  </script>
</body>
</html>
