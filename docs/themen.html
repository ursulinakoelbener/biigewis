<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themen</title>
  <link rel="stylesheet" href="https://edwardtufte.github.io/tufte-css/tufte.css" />
  <link rel="stylesheet" href="custom.css" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    body { font-family: sans-serif; }
    main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    .intro-text { margin: 0 0 1.5rem 0; max-width: 1000px; font-size: 1.5rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <h2 id="themen">Themen</h2>
    <p class="intro-text">Alle Visualisierungen, geordnet nach Thema.</p>

    <div data-pages="overview">
      <p>Die Übersicht konnte nicht geladen werden.</p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script>
  async function loadHTML(id, url) {
    const resp = await fetch(url);
    const text = await resp.text();
    document.getElementById(id).innerHTML = text;
  }
  loadHTML('header-placeholder', 'components/header.html');
  loadHTML('footer-placeholder', 'components/footer.html');
  </script>
  <script src="pages.js" defer></script>
</body>
</html>
